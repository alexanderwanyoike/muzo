[package]
name = "muzo-desktop"
version = "0.0.0"
description = "Muzo desktop music player"
edition = "2021"
rust-version = "1.77"
license = "UNLICENSED"

[lib]
name = "muzo_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = ["protocol-asset"] }
tauri-plugin-opener = "2.0"
tauri-plugin-dialog = "2.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ulid = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
rusqlite_migration = "1.3.1"
dirs = "5"
walkdir = "2"
lofty = "0.21"
lazy_static = "1"
notify = "8.2.0"
sha2 = "0.10"
base64 = "0.22"
url = "2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
chrono = { version = "0.4", default-features = false, features = ["std"] }

[dev-dependencies]
tempfile = "3"

# Force alloc-no-stdlib to 3.x across the tree. brotli 8.0.3 on crates.io
# hard-pins it to 2.0.4 while its sibling brotli-decompressor 5.x uses 3.x,
# producing ambiguous trait resolutions. With the git patch below widening
# brotli's range to "<4", pinning here lets cargo unify on 3.0.0.
alloc-no-stdlib = "3"

# Workaround: brotli 8.0.3 published on crates.io pins alloc-no-stdlib to 2.x,
# while its sibling brotli-decompressor 5.x uses 3.x. The fix is on upstream
# master but not yet published. See https://github.com/dropbox/rust-brotli
[patch.crates-io]
brotli = { git = "https://github.com/dropbox/rust-brotli", branch = "master" }

[features]
# By default, the crate does not build with Tauri's custom-protocol feature.
# Enable this for production desktop builds.
custom-protocol = ["tauri/custom-protocol"]
