[package]
name = "muzo-desktop"
version = "0.0.6"
edition = "2024"
rust-version = "1.95"
license = "MIT"
publish = false

[dependencies]
iced = { version = "0.14.0", default-features = false, features = ["tiny-skia", "image", "svg", "tokio", "x11", "wayland", "linux-theme-detection"] }
directories = "6.0.0"
base64 = "0.22.1"
keyring = { version = "3.6.3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust", "vendored"] }
reqwest = { version = "0.12.28", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
semver = "1"
serde_json = "1"
sha2 = "0.10"
open = "5"
tempfile = "3"
notify = "8.2.0"
lofty = "0.25.5"
rusqlite = { version = "0.41.1", default-features = false, features = ["bundled", "backup"] }
opus-decoder = "0.1.1"
symphonia = { version = "0.5.5", default-features = false, features = ["ogg"] }
rfd = "0.18.0"
rodio = { version = "0.22.2", default-features = false, features = ["playback", "flac", "mp3", "mp4", "vorbis", "wav"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt"] }
uuid = { version = "1.29.2", features = ["v4"] }
walkdir = "2.5.0"

[lib]
path = "src/lib.rs"

[profile.dev]
debug = 0
