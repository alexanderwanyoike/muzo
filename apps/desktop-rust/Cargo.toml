[package]
name = "muzo-desktop"
default-run = "muzo-desktop"
version = "1.0.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
publish = false

[dependencies]
iced = { version = "0.14.0", default-features = false, features = ["advanced", "tiny-skia", "image", "svg", "tokio", "x11", "wayland", "linux-theme-detection"] }
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp"] }
directories = "6.0.0"
base64 = "0.22.1"
keyring = { version = "3.6.3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust", "vendored"] }
reqwest = { version = "0.12.28", default-features = false, features = ["blocking", "json", "rustls-tls"] }
rusty-leveldb = "4"
serde = { version = "1", features = ["derive"] }
semver = "1"
serde_json = "1"
sha2 = "0.10"
open = "5"
tempfile = "3"
notify = "8.2.0"
ogg = "0.9.2"
lofty = "0.25.5"
rusqlite = { version = "0.41.1", default-features = false, features = ["bundled", "backup"] }
ruopus = { version = "0.1.2", default-features = false, features = ["std"] }
symphonia = { version = "0.5.5", default-features = false, features = ["ogg"] }
rfd = "0.18.0"
rodio = { version = "0.22.2", default-features = false, features = ["playback", "flac", "mp3", "mp4", "vorbis", "wav"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt"] }
unicode-segmentation = "1.13.3"
uuid = { version = "1.29.2", features = ["v4"] }
walkdir = "2.5.0"

[lib]
path = "src/lib.rs"

[dev-dependencies]
iced_runtime = "0.14.0"
iced_tiny_skia = { version = "0.14.1", default-features = false }
tiny-skia = { version = "0.11.4", default-features = false, features = ["std"] }

[target.'cfg(unix)'.dependencies]
aes = "0.8.4"
cbc = "0.1.2"
pbkdf2 = "0.12.2"
sha1 = "0.10.6"

[target.'cfg(target_os = "linux")'.dependencies]
dbus = "0.9.10"
dbus-secret-service = "4.1.0"

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3.7.0"

[target.'cfg(target_os = "windows")'.dependencies]
aes-gcm = "0.10.3"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_System_LibraryLoader"] }

[profile.dev]
debug = 0

[target.'cfg(target_os = "windows")'.build-dependencies]
winresource = { version = "0.1.34", default-features = false }
