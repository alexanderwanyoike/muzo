name: Workspace verification

on:
  pull_request:
  push:
    branches: [dev, main]

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      VITEST_MAX_FORKS: 2
      VITEST_MIN_FORKS: 1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: yarn
      - run: corepack enable
      - run: yarn install --frozen-lockfile
      - run: yarn format:check
      - run: yarn workspace @muzo/distribution lint
      - run: yarn workspace @muzo/distribution typecheck
      - run: yarn workspace @muzo/distribution test
      - run: yarn workspace @muzo/site lint
      - run: yarn workspace @muzo/site typecheck
      - run: yarn site:verify
