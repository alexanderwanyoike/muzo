name: Rust desktop installers

on:
  pull_request:
    paths:
      - "apps/desktop-rust/**"
      - "apps/desktop/assets/icons/**"
      - "apps/desktop/assets/licenses/**"
      - ".github/workflows/desktop-rust-distribution.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-desktop-installers-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            format: appimage
            label: linux-x64
          - os: windows-latest
            format: nsis
            label: windows-x64
          - os: macos-15
            format: dmg
            label: macos-arm64
          - os: macos-15-intel
            format: dmg
            label: macos-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    defaults:
      run:
        shell: bash
        working-directory: apps/desktop-rust
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - run: corepack enable
      - name: Install Linux build and packaging tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libasound2-dev libxkbcommon-dev libwayland-dev libfuse2t64 file
      - run: rustup toolchain install 1.95 --profile minimal
      - name: Install Cargo Packager
        run: |
          yarn exec cargo -- +1.95 install cargo-packager --locked --version 0.11.8 --root "$RUNNER_TEMP/muzo-packager"
          "$RUNNER_TEMP/muzo-packager/bin/cargo-packager" --version
      - run: yarn exec cargo -- +1.95 build --locked --release
      - run: yarn exec "$RUNNER_TEMP/muzo-packager/bin/cargo-packager" -- --config Packager.toml --formats ${{ matrix.format }}
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
      - run: yarn exec cargo -- +1.95 run --locked --release --bin name-installer out/rust-distribution
      - name: Verify Linux AppImage
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          chmod +x out/rust-distribution/*.AppImage
          out/rust-distribution/*.AppImage --appimage-extract >/dev/null
          test -f squashfs-root/AppRun
          find squashfs-root -name muzo-desktop -type f | grep .
      - name: Verify macOS disk image
        if: runner.os == 'macOS'
        shell: bash
        run: hdiutil verify out/rust-distribution/*.dmg
      - name: Verify Windows installer container
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer = Get-ChildItem out/rust-distribution -Filter "*-setup.exe" | Select-Object -First 1
          if (!$installer -or $installer.Length -lt 1024) { throw "Installer missing" }
          $stream = $installer.OpenRead()
          try {
            if ($stream.ReadByte() -ne 77 -or $stream.ReadByte() -ne 90) { throw "Invalid PE installer" }
          } finally {
            $stream.Dispose()
          }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: muzo-rust-${{ matrix.label }}
          path: |
            apps/desktop-rust/out/rust-distribution/Muzo-*.AppImage
            apps/desktop-rust/out/rust-distribution/Muzo-*.exe
            apps/desktop-rust/out/rust-distribution/Muzo-*.dmg
            apps/desktop-rust/out/rust-distribution/latest*.yml
          if-no-files-found: error

  assemble:
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - run: corepack enable
      - run: yarn install --frozen-lockfile
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: muzo-rust-*
          path: release-input
          merge-multiple: true
      - name: Assemble and verify the existing release contract
        run: |
          version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' apps/desktop-rust/Packager.toml)
          yarn release:assemble --input release-input --output release-set --version "$version" --tag "v$version" --source-commit "$(git rev-parse HEAD)"
          cd release-set
          sha256sum --check SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: muzo-rust-release-set
          path: release-set/*
          if-no-files-found: error
