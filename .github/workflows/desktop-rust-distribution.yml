name: Rust desktop installers

on:
  pull_request:
    paths:
      - "apps/desktop-rust/**"
      - "apps/desktop/assets/icons/**"
      - "apps/desktop/assets/licenses/**"
      - "apps/desktop/electron-builder.config.json"
      - "apps/desktop/package.json"
      - "packages/distribution/**"
      - "package.json"
      - "yarn.lock"
      - ".github/workflows/desktop-rust-distribution.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-desktop-installers-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  context:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
      sourceCommit: ${{ steps.release.outputs.sourceCommit }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - run: corepack enable
      - run: yarn install --frozen-lockfile
      - name: Resolve matching native release versions
        id: release
        run: yarn release:context --native --github-output "$GITHUB_OUTPUT"

  package:
    needs: context
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            format: appimage
            label: linux-x64
          - os: windows-latest
            format: nsis
            label: windows-x64
          - os: macos-15
            format: dmg
            label: macos-arm64
            macho: arm64
          - os: macos-15-intel
            format: dmg
            label: macos-x64
            macho: x86_64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    defaults:
      run:
        shell: bash
        working-directory: apps/desktop-rust
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - run: corepack enable
      - name: Install Linux build and packaging tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libasound2-dev libxkbcommon-dev libwayland-dev libfuse2t64 file
      - run: rustup toolchain install 1.95 --profile minimal
      - name: Install Cargo Packager
        if: runner.os != 'Windows'
        run: |
          yarn exec cargo -- +1.95 install cargo-packager --locked --version 0.11.8 --root "$RUNNER_TEMP/muzo-packager"
          "$RUNNER_TEMP/muzo-packager/bin/cargo-packager" --version
      - run: yarn exec cargo -- +1.95 build --locked --release
      - run: yarn exec "$RUNNER_TEMP/muzo-packager/bin/cargo-packager" -- --config Packager.toml --formats appimage
        if: runner.os == 'Linux'
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
      - name: Package the macOS app and disk image
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          yarn exec "$RUNNER_TEMP/muzo-packager/bin/cargo-packager" -- --config Packager.toml --formats app
          stage=$(mktemp -d "$RUNNER_TEMP/muzo-dmg.XXXXXX")
          trap 'rm -rf "$stage"' EXIT
          ditto out/rust-distribution/Muzo.app "$stage/Muzo.app"
          ln -s /Applications "$stage/Applications"
          hdiutil create -format UDZO -volname Muzo -srcfolder "$stage" out/rust-distribution/Muzo.dmg
      - name: Install the existing Windows packaging dependencies
        if: runner.os == 'Windows'
        working-directory: .
        run: yarn install --frozen-lockfile
      - name: Package the Rust payload with the existing Windows installer identity
        if: runner.os == 'Windows'
        working-directory: apps/desktop
        env:
          MUZO_VERSION: ${{ needs.context.outputs.version }}
        run: |
          payload="$RUNNER_TEMP/muzo-rust-payload"
          mkdir -p "$payload/resources"
          cp ../desktop-rust/target/release/muzo-desktop.exe "$payload/muzo.exe"
          cp -R assets/licenses "$payload/resources/licenses"
          builder=$(node -p 'require.resolve("electron-builder/cli.js")')
          node "$builder" --prepackaged "$payload" --win nsis --x64 \
            --config electron-builder.config.json \
            --config.extraMetadata.version="$MUZO_VERSION" \
            --config.directories.output=../desktop-rust/out/rust-distribution --publish never
      - run: yarn exec cargo -- +1.95 run --locked --release --bin name-installer out/rust-distribution
      - name: Verify Linux AppImage
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          chmod +x out/rust-distribution/*.AppImage
          out/rust-distribution/*.AppImage --appimage-extract >/dev/null
          test -f squashfs-root/AppRun
          find squashfs-root -name muzo-desktop -type f | grep .
      - name: Verify macOS disk image
        if: runner.os == 'macOS'
        shell: bash
        env:
          MUZO_ARCH: ${{ matrix.macho }}
        run: |
          set -euo pipefail
          image=(out/rust-distribution/*.dmg)
          test "${#image[@]}" -eq 1
          hdiutil verify "${image[0]}"
          mountpoint=$(mktemp -d "$RUNNER_TEMP/muzo-mounted.XXXXXX")
          trap 'hdiutil detach "$mountpoint" -force -quiet || true; rmdir "$mountpoint"' EXIT
          hdiutil attach "${image[0]}" -readonly -nobrowse -noautoopen -mountpoint "$mountpoint"
          test "$(readlink "$mountpoint/Applications")" = /Applications
          bundle="$mountpoint/Muzo.app/Contents"
          plist="$bundle/Info.plist"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$plist")" = com.muzo.desktop
          executable=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$plist")
          test -x "$bundle/MacOS/$executable"
          cmp target/release/muzo-desktop "$bundle/MacOS/$executable"
          lipo "$bundle/MacOS/$executable" -verify_arch "$MUZO_ARCH"
      - name: Verify Windows installer container
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer = Get-ChildItem out/rust-distribution -Filter "*-setup.exe" | Select-Object -First 1
          if (!$installer -or $installer.Length -lt 1024) { throw "Installer missing" }
          $stream = $installer.OpenRead()
          try {
            if ($stream.ReadByte() -ne 77 -or $stream.ReadByte() -ne 90) { throw "Invalid PE installer" }
          } finally {
            $stream.Dispose()
          }
      - name: Verify an installed Windows upgrade
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $legacy = Join-Path $env:RUNNER_TEMP 'Muzo-legacy-setup.exe'
          Invoke-WebRequest 'https://github.com/alexanderwanyoike/muzo/releases/download/v0.0.6/Muzo-0.0.6-windows-x64-setup.exe' -OutFile $legacy
          if ((Get-FileHash $legacy).Hash -ne '0a21cc92b92f39a0f8ee406284eb434ec45ab2ad3565cb648d69e356e31e53dc') {
            throw 'The legacy installer checksum changed.'
          }
          $candidate = Get-ChildItem out/rust-distribution -Filter '*-setup.exe' | Select-Object -First 1
          ./tests/manual/windows-upgrade.ps1 -LegacyInstaller $legacy -RustInstaller $candidate.FullName `
            -InstallDirectory (Join-Path $env:RUNNER_TEMP 'muzo-upgrade-custom') `
            -RustBinary 'target/release/muzo-desktop.exe'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: muzo-rust-${{ matrix.label }}
          path: |
            apps/desktop-rust/out/rust-distribution/Muzo-*.AppImage
            apps/desktop-rust/out/rust-distribution/Muzo-*.exe
            apps/desktop-rust/out/rust-distribution/Muzo-*.dmg
            apps/desktop-rust/out/rust-distribution/latest*.yml
          if-no-files-found: error

  assemble:
    needs: [context, package]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - run: corepack enable
      - run: yarn install --frozen-lockfile
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: muzo-rust-*
          path: release-input
          merge-multiple: true
      - name: Assemble and verify the existing release contract
        env:
          MUZO_VERSION: ${{ needs.context.outputs.version }}
          MUZO_TAG: ${{ needs.context.outputs.tag }}
          MUZO_SOURCE_COMMIT: ${{ needs.context.outputs.sourceCommit }}
        run: |
          set -euo pipefail
          yarn release:assemble --input "$GITHUB_WORKSPACE/release-input" --output "$GITHUB_WORKSPACE/release-set" --version "$MUZO_VERSION" --tag "$MUZO_TAG" --source-commit "$MUZO_SOURCE_COMMIT"
          cd release-set
          sha256sum --check SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: muzo-rust-release-set
          path: release-set/*
          if-no-files-found: error
